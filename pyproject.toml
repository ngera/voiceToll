[project]
name = "voicetoll-workspace"
version = "0.0.0"
description = "voiceToll monorepo: per-call cost and latency for voice AI apps"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[dependency-groups]
dev = [
    "voicetoll",
    "voicetoll-collector",
    "pytest>=8",
    "ruff>=0.6",
]
# G3 test agent only (heavy: LiveKit plugins, Silero/onnxruntime). Install with: uv sync --group test-agent
test-agent = [
    "livekit-agents[deepgram,openai,elevenlabs,cartesia,silero]>=1.2,<2",
    "python-dotenv>=1.0",
]
# G3 test agent, Pipecat edition (examples/test_agent/pipecat_agent.py). Install with:
#   uv sync --group test-agent-pipecat
# webrtc + runner: talk in the browser at http://localhost:7860; local: laptop mic and speakers (PyAudio)
test-agent-pipecat = [
    "pipecat-ai[deepgram,openai,elevenlabs,cartesia,silero,webrtc,runner,local]>=1.12,<2",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
# The two test agents pull large, independently pinned stacks (onnxruntime, numpy, protobuf...). Resolve them
# separately so neither constrains the other; sync one group at a time.
conflicts = [[{ group = "test-agent" }, { group = "test-agent-pipecat" }]]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
voicetoll = { workspace = true }
voicetoll-collector = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
