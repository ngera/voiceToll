# voiceToll local stack: Postgres + collector (+ Grafana with the "observability" profile).
#   docker compose up -d                      # postgres + collector
#   docker compose --profile observability up -d   # adds Grafana on :3000
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: voicetoll
      POSTGRES_PASSWORD: voicetoll
      POSTGRES_DB: voicetoll
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicetoll"]
      interval: 5s
      retries: 10

  collector:
    build:
      context: .
      dockerfile: packages/voicetoll-collector/Dockerfile
    environment:
      VOICETOLL_DB_URL: postgresql://voicetoll:voicetoll@postgres:5432/voicetoll
      VOICETOLL_INGEST_KEYS: ${VOICETOLL_INGEST_KEYS:-demo=dev-key}
      VOICETOLL_SPOOL_DIR: /data/spool
      VOICETOLL_RATE_CARDS: /app/config/rate_cards.yaml
    ports:
      - "4319:4319"
    volumes:
      - spool:/data/spool
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - postgres

volumes:
  pgdata:
  spool:
