[project]
name = "voicetoll"
version = "0.1.0.dev0"
description = "In-app adapters for voiceToll: capture voice AI usage and latency without touching the call path"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []  # stdlib only, on purpose: nothing extra lands in the app

[project.optional-dependencies]
livekit = ["livekit-agents>=1.0,<2"]
pipecat = ["pipecat-ai>=0.0.67,<2"]
contract = ["livekit-agents>=1.0,<2", "pipecat-ai>=0.0.67,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicetoll"]
