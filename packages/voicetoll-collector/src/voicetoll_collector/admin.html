<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>voiceToll admin</title>
<script>
  // Theme before first paint (Console Kit: dark-first, light is stepped, not inverted)
  (function () { try { var t = localStorage.getItem("voicetoll.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {} })();
</script>
<style>
  :root, [data-theme="dark"] {
    --bg:#0B0E13; --surface:#131821; --surface-raised:#10141B; --surface-2:#1A212C; --inset:#0F141C;
    --line-soft:#1E2530; --line:#252D3A; --line-strong:#2C3646;
    --fg:#E8ECF3; --fg-2:#9AA6B8; --fg-3:#7C8A9E; --fg-4:#55606F;
    --accent:#3DDC97; --accent-hover:#6FE9B5; --accent-ink:#04231A; --accent-bg:#12211B; --accent-line:#1E4436;
    --pos-bg:#12211B; --pos-line:#1E4436; --pos-ink:#6FE9B5; --pos:#3DDC97;
    --warn-bg:#241D0F; --warn-line:#4A3A18; --warn-ink:#F5B544; --warn:#F5B544;
    --neg-bg:#2A1414; --neg-line:#5A2626; --neg-ink:#FF7A7A; --neg:#FF7A7A;
    --info-bg:#101A26; --info-line:#1E3A52; --info-ink:#6BA6FF; --info:#6BA6FF;
    --idle:#55606F;
    --wb-bg:#1A1710; --wb-line:#45361B; --wb-ink:#F5D9A0; --wb-body:#C9B58A;
    --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500; --cat-5:#d55181; --cat-6:#9085e9; --cat-muted:#5B6B83;
    --chart-ok:#35BE86; --chart-slow:#E0A23C; --chart-bad:#E4595E; --chart-zero:#3B4557; --chart-track:#1D2430;
    color-scheme: dark;
  }
  [data-theme="light"] {
    --bg:#F4F6F5; --surface:#FFFFFF; --surface-raised:#FFFFFF; --surface-2:#F0F3F2; --inset:#E9EDEC;
    --line-soft:#EBEFEE; --line:#DDE3E1; --line-strong:#C9D2CF;
    --fg:#10171C; --fg-2:#4B5A63; --fg-3:#5E6B74; --fg-4:#8A959B;
    --accent:#0A8158; --accent-hover:#086A48; --accent-ink:#FFFFFF; --accent-bg:#E7F5EF; --accent-line:#BFE3D4;
    --pos-bg:#E7F5EF; --pos-line:#BFE3D4; --pos-ink:#07603F; --pos:#0A8158;
    --warn-bg:#FDF6E7; --warn-line:#EBD9AE; --warn-ink:#8A5606; --warn:#96590A;
    --neg-bg:#FDECEC; --neg-line:#F0C4C0; --neg-ink:#A32F23; --neg:#C0392B;
    --info-bg:#EAF2FC; --info-line:#C7DCF5; --info-ink:#15529F; --info:#1B63C4;
    --idle:#8A959B;
    --wb-bg:#FDF6E7; --wb-line:#EBD9AE; --wb-ink:#5C4415; --wb-body:#7A5C22;
    --cat-1:#2a78d6; --cat-2:#eb6834; --cat-3:#1baf7a; --cat-4:#eda100; --cat-5:#e87ba4; --cat-6:#4a3aa7; --cat-muted:#6E7A87;
    --chart-ok:#158A60; --chart-slow:#B8730C; --chart-bad:#C0392B; --chart-zero:#B6C0BD; --chart-track:#E9EDEC;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); text-decoration: none; } a:hover { color: var(--accent-hover); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mono, td.num, th.num { font-family: ui-monospace, Consolas, monospace; }
  .label { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); }
  .cap { font-size: 11.5px; color: var(--fg-3); }
  .muted { color: var(--fg-2); }
  .shell { display: flex; min-height: 100vh; }
  nav.rail { width: 208px; flex-shrink: 0; padding: 20px 12px; background: var(--surface-raised); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 8px; padding: 0 10px 18px; font-weight: 600; font-size: 14px; }
  .brand .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); }
  .tag { display: inline-block; white-space: nowrap; padding: 1px 6px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line-strong); color: var(--fg-2); font-size: 11px; font-weight: 400; }
  nav.rail a { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 34px; padding: 0 10px; border-radius: 8px; color: var(--fg-2); font-weight: 500; }
  nav.rail a:hover { background: var(--surface-2); color: var(--fg); }
  nav.rail a[aria-current="page"] { background: var(--accent-bg); color: var(--pos-ink); }
  nav.rail a span.l { display: flex; align-items: center; gap: 8px; }
  nav.rail .spacer { flex-grow: 1; }
  main { flex-grow: 1; min-width: 0; padding: 24px 28px 48px; display: flex; flex-direction: column; gap: 20px; }
  header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 25px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
  h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .sub { margin: 4px 0 0; color: var(--fg-2); }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 10px; flex-wrap: wrap; }
  .card-head .t { display: flex; align-items: baseline; gap: 10px; }
  .card-body { padding: 0 16px 16px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; }
  .tile { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .tile .v { font-family: ui-monospace, Consolas, monospace; font-size: 30px; font-weight: 600; letter-spacing: -0.025em; line-height: 1; }
  .tile .v.sm { font-size: 19px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .grid2 > *, main > *, .card, .card-body { min-width: 0; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 500; white-space: nowrap; border: 1px solid; }
  .pill i { width: 6px; height: 6px; border-radius: 999px; display: inline-block; }
  .pos { background: var(--pos-bg); border-color: var(--pos-line); color: var(--pos-ink); } .pos i { background: var(--pos); }
  .warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); } .warn i { background: var(--warn); }
  .neg { background: var(--neg-bg); border-color: var(--neg-line); color: var(--neg-ink); } .neg i { background: var(--neg); }
  .info { background: var(--info-bg); border-color: var(--info-line); color: var(--info-ink); } .info i { background: var(--info); }
  .idle { background: var(--surface-2); border-color: var(--line-strong); color: var(--fg-2); } .idle i { background: var(--idle); }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 9px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-size: 12.5px; }
  th button.sort { all: unset; cursor: pointer; } th button.sort:focus-visible { outline: 2px solid var(--accent); }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--fg); font: inherit; font-size: 12.5px; cursor: pointer; }
  .btn:hover { border-color: var(--fg-3); }
  .btn.on { background: var(--accent-bg); border-color: var(--accent-line); color: var(--pos-ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  select, input[type=search], input[type=date], input[type=number], input[type=password] { height: 30px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--inset); color: var(--fg); font: inherit; font-size: 12.5px; padding: 0 8px; }
  select { background: var(--surface-2); }
  input[type=checkbox] { accent-color: var(--accent); }
  .filters { padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
  .frow { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .frow2 { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line-soft); padding-top: 10px; }
  .toggle { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--fg-2); font: inherit; font-size: 12px; cursor: pointer; }
  .toggle[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent-line); color: var(--pos-ink); }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 4px 0 10px; border-radius: 999px; background: var(--accent-bg); border: 1px solid var(--accent-line); color: var(--pos-ink); font-size: 12px; }
  .chip button { width: 20px; height: 20px; border-radius: 999px; border: 0; background: transparent; color: inherit; cursor: pointer; font: inherit; padding: 0; }
  .chip button:hover { background: var(--accent-line); }
  .banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 8px; border: 1px solid; }
  .banner.warn { background: var(--wb-bg); border-color: var(--wb-line); color: var(--wb-body); } .banner.warn b { color: var(--wb-ink); }
  .banner.neg { background: var(--neg-bg); border-color: var(--neg-line); color: var(--fg); } .banner.neg b { color: var(--neg-ink); }
  .banner.info { background: var(--info-bg); border-color: var(--info-line); color: var(--fg); } .banner.info b { color: var(--info-ink); }
  .banner p { margin: 0; }
  .bar { height: 6px; border-radius: 999px; background: var(--chart-track); overflow: hidden; }
  .bar > div { height: 100%; border-radius: 999px; }
  .hbar { display: grid; grid-template-columns: minmax(90px, 180px) minmax(0, 1fr) 90px; gap: 10px; align-items: center; }
  .hbar .track { height: 10px; border-radius: 999px; background: var(--chart-track); overflow: hidden; } .hbar .track > div { height: 100%; border-radius: 999px; }
  .stack { display: flex; gap: 3px; height: 160px; border-bottom: 1px solid var(--chart-zero); align-items: stretch; }
  .stack .col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 1px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 11.5px; color: var(--fg-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; } .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .reading { font-size: 11.5px; color: var(--fg-2); margin: 10px 0 0; }
  .cell { width: 12px; height: 12px; border-radius: 4px; display: inline-block; border: 1px solid var(--chart-track); }
  pre.yaml { margin: 0; padding: 12px; background: var(--inset); border: 1px solid var(--line-soft); border-radius: 8px; font: 12px/1.6 ui-monospace, Consolas, monospace; white-space: pre; overflow-x: auto; }
  code { font: 12px ui-monospace, Consolas, monospace; background: var(--inset); border: 1px solid var(--line-soft); border-radius: 5px; padding: 0 4px; }
  .empty { padding: 24px 16px; color: var(--fg-2); }
  .keybox { max-width: 460px; margin: 12vh auto; padding: 24px; }
  .keybox form { display: flex; gap: 8px; margin-top: 12px; } .keybox input { flex-grow: 1; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .spark { display: flex; gap: 2px; height: 110px; align-items: flex-end; border-bottom: 1px solid var(--chart-zero); }
  .spark > div { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 1px; }
  .warnrow { display: grid; grid-template-columns: 150px 220px minmax(0, 1fr); gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
  @media (max-width: 900px) {
    .shell { flex-direction: column; } nav.rail { width: auto; height: auto; position: static; flex-direction: row; flex-wrap: wrap; }
    nav.rail .spacer, nav.rail .cap { display: none; } .grid2 { grid-template-columns: 1fr; } main { padding: 16px; }
    pre.yaml { white-space: pre-wrap; } .warnrow { grid-template-columns: 1fr; gap: 2px; }
    .btn, select, input, .toggle { min-height: 44px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media print { nav.rail, .filters, .controls { display: none !important; } .card { break-inside: avoid; } }
</style>
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Admin sections">
    <div class="brand"><span class="mark" aria-hidden="true"></span>voiceToll <span class="tag">admin</span></div>
    <a href="#view=prices" data-view="prices"><span class="l">Prices</span><span id="badge-prices"></span></a>
    <a href="#view=reports" data-view="reports"><span class="l">Reports</span><span id="badge-reports"></span></a>
    <a href="#view=cost" data-view="cost"><span class="l">Cost</span><span id="badge-cost"></span></a>
    <a href="#view=health" data-view="health"><span class="l">Health</span><span id="badge-health"></span></a>
    <div class="spacer"></div>
    <button class="btn" id="themeBtn" type="button" aria-label="Switch colour theme">Light theme</button>
    <div class="cap" id="replica" style="padding: 8px 10px 0"></div>
    <a href="#" id="signOut">Sign out</a>
  </nav>
  <main id="main" aria-live="polite"><div class="empty">Loading…</div></main>
</div>
<script>
(function () {
  "use strict";
  const ADMIN_KEY_STORE = "voicetoll.adminKey";
  const main = document.getElementById("main");
  let projects = [];
  let lastHealth = null;
  let healthTimer = null;

  // ---------- small helpers ----------
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const usd = (n, d) => n == null ? "—" : "$" + Number(n).toLocaleString(undefined, { minimumFractionDigits: d ?? (Math.abs(n) < 1 ? 4 : 2), maximumFractionDigits: d ?? (Math.abs(n) < 1 ? 4 : 2) });
  const pct = (x, d = 1) => x == null ? "—" : (x * 100).toFixed(d) + "%";
  const num = (n) => n == null ? "—" : Number(n).toLocaleString();
  const ago = (epoch) => { if (!epoch) return "never"; const s = Date.now() / 1000 - epoch; if (s < 60) return `${Math.round(s)} s ago`; if (s < 3600) return `${Math.round(s / 60)} min ago`; if (s < 86400) return `${Math.round(s / 3600)} h ago`; return `${Math.round(s / 86400)} d ago`; };
  const utc = (epoch) => new Date(epoch * 1000).toISOString().replace("T", " ").slice(0, 19) + " UTC";
  const change = (now, before) => (before == null || !before) ? null : (now - before) / before;
  const changeText = (now, before, fmt) => { const c = change(now, before); return c == null ? "no prior period" : `${c >= 0 ? "up" : "down"} ${Math.abs(c * 100).toFixed(1)}% from ${fmt(before)}`; };
  const lagText = (s) => s == null ? "—" : s < 120 ? `${s} s` : s < 7200 ? `${Math.round(s / 60)} min` : `${(s / 3600).toFixed(1)} h`;
  const pill = (kind, text) => `<span class="pill ${esc(kind)}"><i aria-hidden="true"></i>${esc(text)}</span>`;
  const stateKind = (s) => ({ healthy: "pos", loaded: "pos", degraded: "warn", failing: "neg" }[s] || "idle");
  const COMPONENT_COLORS = { stt: "var(--cat-1)", llm: "var(--cat-2)", tts: "var(--cat-3)", s2s: "var(--cat-4)", telephony: "var(--cat-5)", platform: "var(--cat-6)" };
  let palette = {};  // dimension -> every value seen in the range, sorted: the colour follows the entity, not its rank
  function colorFor(key, by) {
    if (by === "component" && COMPONENT_COLORS[key]) return COMPONENT_COLORS[key];
    if (key === "Other" || key == null) return "var(--cat-muted)";
    const known = palette[by] || []; const i = known.indexOf(key);
    if (i >= 0 && known.length <= 6) return `var(--cat-${i + 1})`;
    let h = 0; for (const ch of String(key)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;  // colour follows the entity, not its rank
    return `var(--cat-${(h % 6) + 1})`;
  }
  function getKey() { try { return sessionStorage.getItem(ADMIN_KEY_STORE) || ""; } catch { return ""; } }
  function setKey(k) { try { k ? sessionStorage.setItem(ADMIN_KEY_STORE, k) : sessionStorage.removeItem(ADMIN_KEY_STORE); } catch {} }
  class AuthError extends Error {}
  async function api(path) {
    const headers = {}; const key = getKey();
    if (key) headers["X-Voicetoll-Admin-Key"] = key;
    const res = await fetch(path, { headers, cache: "no-store" });
    if (res.status === 401 || res.status === 404) throw new AuthError(res.status === 404 ? "off" : "rejected");
    if (!res.ok) { let msg = `${res.status}`; try { msg = (await res.json()).error || msg; } catch {} throw new Error(msg); }
    return res.json();
  }

  // ---------- routing (hash holds the view and its filters, so every screen is linkable) ----------
  function route() { const p = new URLSearchParams(location.hash.slice(1)); const o = Object.fromEntries(p.entries()); o.view = o.view || "prices"; return o; }
  function go(patch, replace) {
    const next = { ...route(), ...patch };
    const p = new URLSearchParams();
    for (const [k, v] of Object.entries(next)) if (v !== "" && v != null && v !== false) p.set(k, v);
    const hash = "#" + p.toString();
    if (replace) history.replaceState(null, "", hash); else location.hash = hash;
    if (replace) render();
  }
  const list = (v) => (v ? String(v).split(",").filter(Boolean) : []);

  // ---------- shared pieces ----------
  function header(title, sub, controlsHtml) {
    return `<header class="top"><div><h1>${esc(title)}</h1><p class="sub">${sub}</p></div><div class="controls">${controlsHtml}</div></header>`;
  }
  function projectSelect(allowAll) {
    const r = route(); const current = r.project || (allowAll ? "" : (projects[0] || {}).project || "");
    const opts = (allowAll ? `<option value="">All projects</option>` : "") + projects.map((p) => `<option value="${esc(p.project)}" ${p.project === current ? "selected" : ""}>${esc(p.project)}</option>`).join("");
    return `<label class="label" for="projSel">Project</label><select id="projSel">${opts}</select>`;
  }
  function rangeButtons() {
    const days = route().days || "30";
    return ["7", "30", "90"].map((d) => `<button class="btn ${d === days ? "on" : ""}" type="button" data-days="${d}" aria-pressed="${d === days}">${d} d</button>`).join("");
  }
  function wireHeader() {
    const sel = document.getElementById("projSel"); if (sel) sel.onchange = () => go({ project: sel.value });
    main.querySelectorAll("[data-days]").forEach((b) => b.onclick = () => go({ days: b.dataset.days }));
  }
  function tile(label, value, note, extra = "", small = false) {
    return `<div class="card tile"><div class="label">${esc(label)}</div><div class="v ${small ? "sm" : ""}">${value}</div><div class="cap">${note}</div>${extra}</div>`;
  }
  function card(title, body, sub = "", right = "", pad = true) {
    return `<section class="card"><div class="card-head"><div class="t"><h2>${esc(title)}</h2><span class="cap">${sub}</span></div><div class="controls">${right}</div></div>${pad ? `<div class="card-body">${body}</div>` : body}</section>`;
  }
  function field(label, id, control) { return `<div class="field"><label class="label" for="${id}">${esc(label)}</label>${control}</div>`; }
  function select(id, options, value, width = 150, allLabel = "All") {
    const opts = `<option value="">${esc(allLabel)}</option>` + options.map((o) => { const [v, t] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(v) === String(value ?? "") ? "selected" : ""}>${esc(t)}</option>`; }).join("");
    return `<select id="${id}" data-f="${id}" style="width:${width}px">${opts}</select>`;
  }
  function filterBar(fieldsHtml, toggles, chips, countText) {
    const t = toggles.map(([key, text, on]) => `<button class="toggle" type="button" data-toggle="${esc(key)}" aria-pressed="${on}">${esc(text)}</button>`).join("");
    const c = chips.map(([key, text]) => `<span class="chip">${esc(text)}<button type="button" data-clear="${esc(key)}" aria-label="Remove filter ${esc(text)}">×</button></span>`).join("");
    return `<section class="card filters" aria-label="Filters"><div class="frow">${fieldsHtml}<div style="flex-grow:1"></div>
      <button class="btn" type="button" id="saveView">Save view</button><select id="savedViews" aria-label="Saved views"><option value="">Saved views</option>${savedViews().map((v, i) => `<option value="${i}">${esc(v.name)}</option>`).join("")}</select>
      <button class="btn" type="button" id="resetFilters">Reset</button></div>
      <div class="frow2"><div class="controls">${toggles.length ? `<span class="label">Show</span>${t}` : ""}</div><div class="controls">${c}<span class="cap">${countText}</span></div></div></section>`;
  }
  function savedViews() { try { return JSON.parse(localStorage.getItem("voicetoll.adminViews") || "[]"); } catch { return []; } }
  function wireFilters(keys, toggleKey, defaults = []) {
    keys.forEach((k) => { const el = document.getElementById(k); if (!el) return; const ev = el.tagName === "SELECT" ? "change" : "input";
      let t; el.addEventListener(ev, () => { clearTimeout(t); t = setTimeout(() => go({ [k]: el.value }, true), el.type === "search" ? 250 : 0); }); });
    main.querySelectorAll("[data-toggle]").forEach((b) => b.onclick = () => {
      const cur = route()[toggleKey];

  function banner(kind, lead, body) { return `<div class="banner ${kind}" role="status">${pill(kind === "warn" ? "warn" : kind, kind === "warn" ? "warning" : kind === "neg" ? "failing" : "note")}<p><b>${lead}</b> ${body}</p></div>`; }

  async function renderPrices() {

  // ---------- Prices: all available (voice-prices catalog + rate cards) ----------

  const PAGE = 100;
  function rateCardYaml(row) {

      <div><div class="label">Ingest p95</div><div class="mono" style="font-size:19px;font-weight:600">${p95 == null ? "—" : p95.toFixed(1) + " ms"}</div><div class="cap">worst minute, last hour</div></div></div>
      <div class="legend" style="margin-top:12px"><span><i style="background:var(--cat-1)"></i>accepted</span><span><i style="background:var(--cat-2)"></i>rejected</span></div>
      <div class="spark" style="margin-top:8px;gap:${s.length > 120 ? 0 : 2}px">${bars}</div><div class="cap" style="display:flex;justify-content:space-between"><span>${utc(s[0].epoch).slice(11, 16)}</span><span>${utc(s[s.length - 1].epoch).slice(11, 16)} UTC</span></div>
      <p class="reading">${acc ? `${num(acc)} events accepted in the last hour${rej ? `, ${num(rej)} rejected by the schema check` : " with no rejections"}.` : "No events received in the last hour on this replica."}</p>`, `per minute, this replica`);
    const srows = sources.map((x) => { const quiet = x.last_event_epoch && Date.now() / 1000 - x.last_event_epoch > 1800;
      return `<tr><td style="font-weight:500">${esc(x.project)}</td><td><span class="tag">${esc(x.source || "sdk")}</span></td><td class="num">${ago(x.last_event_epoch)}</td><td class="num">${num(x.events_last_hour)}</td><td class="num">${lagText(x.lag_p95_s)}</td><td>${quiet ? pill("warn", "quiet") : pill("pos", "sending")}</td></tr>`; }).join("");
    const quiet = sources.filter((x) => x.last_event_epoch && Date.now() / 1000 - x.last_event_epoch > 1800);
    html += card("Who is sending", srows ? `<div class="tablewrap"><table><thead><tr><th>Project</th><th>Source</th><th class="num">Last event</th><th class="num">Last hour</th><th class="num">Receive lag p95</th><th>Status</th></tr></thead><tbody>${srows}</tbody></table></div>
      <p class="reading" style="padding:0 16px 14px">${quiet.length ? `${quiet.map((x) => esc(x.project) + " · " + esc(x.source)).join(", ")} ha${quiet.length > 1 ? "ve" : "s"} sent nothing for over 30 minutes. Adapters fail open, so a broken one goes quiet rather than erroring: check its collector endpoint and key.` : "Every source has sent events in the last 30 minutes."} Receive lag is the time from the event to the collector receiving it, which exposes client buffering and retries.</p>` : `<div class="empty">No events in the last 7 days.</div>`,
      "per project and source, last 7 days", "", false);
    const clients = (h.clients || []).filter((c) => !r.project || c.project === r.project);
    const clientRows = clients.map((c) => { const fresh = Date.now() / 1000 - c.reported_epoch < 3600; const fill = c.buffer_max ? c.buffer_len / c.buffer_max : 0;
      const gap = (c.received_before || 0) - (c.sent || 0);
      const state = !fresh ? pill("idle", "not reporting") : gap < 0 ? pill("neg", "missing events") : c.dropped ? pill("warn", "dropping") : c.errors ? pill("warn", "errors") : pill("pos", "ok");
      const arrived = `<td class="num" title="Events from this app process that reached the collector (before its latest batch). Should equal Sent; higher means retried batches, stored once.">${num(c.received_before || 0)}${gap ? `<div class="cap" style="color:${gap < 0 ? "var(--neg-ink)" : "var(--fg-3)"}">${gap > 0 ? "+" : ""}${num(gap)}</div>` : ""}</td>`;
      return `<tr><td style="font-weight:500">${esc(c.project)}</td><td class="mono cap" title="${esc(c.client_id)}">${esc(c.client_id.slice(-8))}</td><td class="cap">${esc(c.sdk_version || "—")}</td><td>${c.source ? c.source.split(",").map((x) => `<span class="tag">${esc(x)}</span>`).join(" ") : "—"}</td>
        <td class="num">${num(c.sent)}</td>${arrived}<td class="num" style="color:${c.dropped ? "var(--warn-ink)" : "inherit"}">${num(c.dropped)}</td><td class="num">${num(c.errors)}</td>
        <td class="num">${pct(fill, 0)}<div class="bar" style="width:60px;display:inline-block;margin-left:6px;vertical-align:middle"><div style="width:${(fill * 100).toFixed(0)}%;background:${fill > 0.8 ? "var(--chart-bad)" : "var(--cat-1)"}"></div></div></td>
        <td class="num">${ago(c.reported_epoch)}</td><td>${state}</td></tr>`; }).join("");
    const dropTotal = clients.filter((c) => Date.now() / 1000 - c.reported_epoch < 3600).reduce((s, c) => s + c.dropped, 0);
    html += card("Clients", clientRows ? `<div class="tablewrap"><table><thead><tr><th>Project</th><th>Client</th><th>SDK</th><th>Source</th><th class="num">Sent</th><th class="num">Arrived</th><th class="num">Dropped</th><th class="num">Errors</th><th class="num">Buffer</th><th class="num">Last report</th><th>Status</th></tr></thead><tbody>${clientRows}</tbody></table></div>
      <p class="reading" style="padding:0 16px 14px">${dropTotal ? `Active clients have dropped ${num(dropTotal)} events since they started, so those calls are under-counted. Drops happen when the in-app buffer fills, usually because the collector was unreachable for longer than the retry window.` : "No active client has dropped events."} Counters are cumulative per app process and arrive with each batch the client sends. <b>Sent</b> is what the client saw acknowledged; <b>Arrived</b> is what this collector counted from the same process, so the two should match.</p>`
      : `<div class="empty">No client has reported counters in the last 7 days. Clients from voicetoll 0.1.0 onward send them with every batch.</div>`,
      "in-app counters, one row per app process, last 7 days", "", false);
    const crow = connectors.map((c) => `<tr><td>${esc(c.project)}</td><td style="font-weight:500">${esc(c.provider)}</td><td class="cap">${esc(c.scope)}</td><td>${c.key_set ? pill("pos", c.key_from === "agent key" ? "agent key" : "set") : pill("warn", "missing")}</td><td>${!c.has_connector ? pill("idle", "no connector") : c.last_status ? pill(c.last_status === "ok" ? "pos" : c.last_status === "drift" ? "neg" : "warn", c.last_status.replace(/_/g, " ")) : pill("idle", "not run")}</td><td class="num">${c.drift_days}</td></tr>`).join("");
    const wrows = warns.slice(0, 100).map((w) => `<div class="warnrow"><span class="mono cap">${utc(w.epoch).slice(0, 19)}</span><span class="mono cap">${esc(w.level)} · ${esc(w.logger)}</span><span class="muted">${esc(w.message)}</span></div>`).join("");
    html += `<div class="grid2">${card("Reconciliation connectors", crow ? `<div class="tablewrap"><table><thead><tr><th>Project</th><th>Provider</th><th>Scope</th><th>Key</th><th>Last run</th><th class="num">Drift days</th></tr></thead><tbody>${crow}</tbody></table></div>` : `<div class="empty">${h.connectors_error ? "The reconciliation config did not load: " + esc(h.connectors_error) : "No reconciliation accounts configured (VOICETOLL_RECON_CONFIG)."}</div>`, "keys are never shown, only whether one is set", "", false)}
      ${card("Recent warnings", wrows || `<div class="empty">No warnings since this replica started.</div>`, `collector log, since start · ${warns.length} shown`)}</div>
      <p class="cap">Series reset on restart and show this replica only. For fleet-wide and long-range health, scrape <code>/metrics</code> with Prometheus.</p>`;
    main.innerHTML = html; wireFilters(["project", "source", "window", "level", "wq"], "states", ["healthy", "degraded", "failing", "not configured"]);
    document.getElementById("refresh").onclick = () => render();
  }

  // ---------- shell ----------
  function badge(view, html) { const el = document.getElementById("badge-" + view); if (el) el.innerHTML = html; }
  function keyPanel(message) {
    main.innerHTML = `<div class="card keybox"><h2>Admin key</h2><p class="muted">${esc(message)} Enter the value of <code>VOICETOLL_ADMIN_KEY</code>. It is kept in this browser tab only and cleared when the tab closes.</p>
      <form id="keyForm"><label class="sr" for="keyInput">Admin key</label><input type="password" id="keyInput" autocomplete="off" value="${esc(getKey())}"><button class="btn primary" type="submit">Sign in</button></form></div>`;
    document.getElementById("keyForm").onsubmit = (e) => { e.preventDefault(); setKey(document.getElementById("keyInput").value.trim()); start(); };
    document.getElementById("keyInput").focus();
  }
  const VIEWS = { prices: renderPrices, reports: renderReports, cost: renderCost, health: renderHealth };
  async function render() {
    const r = route();
    document.querySelectorAll("nav.rail a[data-view]").forEach((a) => a.setAttribute("aria-current", a.dataset.view === r.view ? "page" : "false"));
    clearInterval(healthTimer);
    if (r.view === "health") healthTimer = setInterval(() => { if (document.visibilityState === "visible" && document.activeElement?.tagName !== "INPUT") render(); }, 30000);
    const focused = document.activeElement && main.contains(document.activeElement) ? document.activeElement : null;
    const focusId = focused && focused.id; const caret = focused && "selectionStart" in focused ? focused.selectionStart : null;
    try {
      await (VIEWS[r.view] || renderPrices)();
      const again = focusId && document.getElementById(focusId);  // keep typing in a filter after the view re-renders
      if (again) { again.focus(); if (caret != null && again.setSelectionRange && again.type === "search") try { again.setSelectionRange(caret, caret); } catch {} }
    }
    catch (err) {
      if (err instanceof AuthError) keyPanel(err.message === "off" ? "The admin UI is off on this collector until VOICETOLL_ADMIN_KEY is set." : getKey() ? "The collector rejected this key." : "This collector needs an admin key.");
      else main.innerHTML = `<div class="banner neg" role="alert"><p><b>Could not load this view:</b> ${esc(err.message)}. Is the collector running?</p></div>`;
    }
  }
  async function start() {
    try { projects = (await api("/v1/admin/projects")).projects; }
    catch (err) { if (err instanceof AuthError) return keyPanel(err.message === "off" ? "The admin UI is off on this collector until VOICETOLL_ADMIN_KEY is set." : getKey() ? "The collector rejected this key." : "This collector needs an admin key."); main.innerHTML = `<div class="banner neg"><p><b>Could not reach the collector:</b> ${esc(err.message)}</p></div>`; return; }
    render();
    // Background badges so every nav item shows its state without visiting it
    if (route().view !== "health") api("/v1/admin/health?minutes=15").then((h) => { const n = h.checks.filter((c) => c.state === "degraded" || c.state === "failing").length; badge("health", n ? pill("warn", `${n} degraded`) : ""); document.getElementById("replica").textContent = `replica ${h.replica}`; }).catch(() => {});
    if (route().view !== "prices") api("/v1/admin/prices?days=7").then((p) => badge("prices", p.summary.stale_rates ? pill("warn", `${p.summary.stale_rates} stale`) : "")).catch(() => {});
  }
  const themeBtn = document.getElementById("themeBtn");
  const syncTheme = () => { themeBtn.textContent = document.documentElement.dataset.theme === "light" ? "Dark theme" : "Light theme"; };
  themeBtn.onclick = () => { const t = document.documentElement.dataset.theme === "light" ? "dark" : "light"; document.documentElement.dataset.theme = t; try { localStorage.setItem("voicetoll.theme", t); } catch {} syncTheme(); };
  syncTheme();
  document.getElementById("signOut").onclick = (e) => { e.preventDefault(); setKey(""); keyPanel("Signed out."); };
  window.addEventListener("hashchange", render);
  start();
})();
</script>
</body>
</html>
